<svg xmlns="http://www.w3.org/2000/svg" width="280" height="54" viewBox="0 0 280 54" role="img" aria-labelledby="t d">
<title id="t">EMAIL</title>
<desc id="d">EMAIL — hi@alexchih.com</desc>
<defs>
<clipPath id="clip"><rect width="280" height="54" rx="13"/></clipPath>
<radialGradient id="l0"><stop offset="0" stop-color="#82b4f0" stop-opacity="1"/><stop offset="0.35" stop-color="#82b4f0" stop-opacity="0.72"/><stop offset="0.6" stop-color="#82b4f0" stop-opacity="0.36"/><stop offset="0.8" stop-color="#82b4f0" stop-opacity="0.12"/><stop offset="1" stop-color="#82b4f0" stop-opacity="0"/></radialGradient>
<radialGradient id="l1"><stop offset="0" stop-color="#a99bea" stop-opacity="1"/><stop offset="0.35" stop-color="#a99bea" stop-opacity="0.72"/><stop offset="0.6" stop-color="#a99bea" stop-opacity="0.36"/><stop offset="0.8" stop-color="#a99bea" stop-opacity="0.12"/><stop offset="1" stop-color="#a99bea" stop-opacity="0"/></radialGradient>
<radialGradient id="l2"><stop offset="0" stop-color="#f2a36b" stop-opacity="1"/><stop offset="0.35" stop-color="#f2a36b" stop-opacity="0.72"/><stop offset="0.6" stop-color="#f2a36b" stop-opacity="0.36"/><stop offset="0.8" stop-color="#f2a36b" stop-opacity="0.12"/><stop offset="1" stop-color="#f2a36b" stop-opacity="0"/></radialGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
</filter>
</defs>
<g clip-path="url(#clip)">
<rect width="280" height="54" fill="#12130f"/>
<ellipse class="lt lt0" cx="-40.0" cy="-5.4" rx="330" ry="45.9" fill="url(#l0)" opacity="0.4"/>
<ellipse class="lt lt1" cx="320.0" cy="20.5" rx="280" ry="42.1" fill="url(#l1)" opacity="0.36"/>
<ellipse class="lt lt2" cx="10.0" cy="60.5" rx="300" ry="38.9" fill="url(#l2)" opacity="0.24"/>
<rect width="280" height="54" filter="url(#grain)" opacity="0.15" style="mix-blend-mode:soft-light"/>
</g>
<rect x=".5" y=".5" width="279" height="53" rx="13" fill="none" stroke="rgba(255,255,255,0.15)"/>
<style>
text{font-family:Manrope,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang TC","Hiragino Sans","Noto Sans TC","Noto Sans JP","Microsoft JhengHei",sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
.fg{fill:#e9e5dc}.bd{fill:#b5afa2}.ft{fill:#a8a193}
.ru{fill:#82b4f0}.ko{fill:#f2a36b}.su{fill:#a99bea}
.lt{animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.lt0{animation-name:d0;animation-duration:31s}
.lt1{animation-name:d1;animation-duration:37s}
.lt2{animation-name:d2;animation-duration:43s}
@keyframes d0{from{transform:translate(0,0)}to{transform:translate(26px,14px)}}
@keyframes d1{from{transform:translate(0,0)}to{transform:translate(-22px,-18px)}}
@keyframes d2{from{transform:translate(0,0)}to{transform:translate(18px,-16px)}}
@media (prefers-reduced-motion:reduce){.lt{animation:none}.pulse{animation:none}}
</style>
<circle cx="25" cy="27" r="4.5" class="ko"/>
<text x="42" y="31.5" class="fg" font-size="11.5" font-weight="600" letter-spacing=".3">EMAIL</text>
<text x="256" y="32" text-anchor="end" class="ft" font-size="12">↗</text>
</svg>
